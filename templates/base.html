
<!DOCTYPE html>
<html>
<head>
    <title>Procurement Management System</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            ProcureFlow
        </a>

        <div class="navbar-nav flex-row flex-wrap gap-3">

            <a class="nav-link text-white" href="/">Dashboard</a>

            <a class="nav-link text-white" href="/requests">
                Requests
            </a>

            <a class="nav-link text-white" href="/suppliers">
                Suppliers
            </a>

            <a class="nav-link text-white" href="/quotes">
                Quotes
            </a>

            <a class="nav-link text-white" href="/orders">
                Orders
            </a>

            <a class="nav-link text-white" href="/exceptions">
                Exceptions
            </a>

            <a class="nav-link text-white" href="/new-request">
                New Request
            </a>

        </div>
    </div>
</nav>

<div class="container py-4">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
